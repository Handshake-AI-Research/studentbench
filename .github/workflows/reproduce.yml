name: Reproduce results
on: workflow_dispatch
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: python -m pip install -e '.[render]'
      - run: python download_data.py --output data
      - run: python reproduce.py --data data --output results --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-results
          path: |
            results/figures/
            results/tables/
            results/verification/
            results/run.json
            results/progress.jsonl
