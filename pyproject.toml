[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studentbench"
version = "1.0.0"
description = "Reproduce StudentBench's studies of AI and human tutoring."
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "StudentBench authors"}]
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "statsmodels==0.15.0",
  "Pillow==12.2.0",
  "fonttools==4.62.1",
  "huggingface_hub>=0.36.2,<2",
]

[project.optional-dependencies]
render = ["PyMuPDF==1.28.2", "CairoSVG==2.9.1", "adjustText==1.3.0", "pypdf==6.9.0"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["studentbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
